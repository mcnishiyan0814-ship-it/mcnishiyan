name: Dashboard Morning Refresh

on:
  schedule:
    # 毎朝 9:00 JST (= 00:00 UTC) に全ジョブを実行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "実行ジョブ (news / todo / slack / learn / limitless / all)"
        required: false
        default: "all"

defaults:
  run:
    working-directory: automation

jobs:
  news:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'news' || inputs.job == 'all' || inputs.job == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run news
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          NEWS_THRESHOLD: "60"
          NEWS_WINDOW_HOURS: "24"

  todo:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'todo' || inputs.job == 'all' || inputs.job == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run todo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}

  slack:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'slack' || inputs.job == 'all' || inputs.job == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run slack
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

  limitless:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'limitless' || inputs.job == 'all' || inputs.job == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run limitless
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
          LIMITLESS_TZ: Asia/Tokyo

  ism:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'ism' || inputs.job == 'all' || inputs.job == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run ism
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  learn:
    if: ${{ github.event_name == 'schedule' || inputs.job == 'learn' || inputs.job == 'all' || inputs.job == '' }}
    needs: [news]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run learn
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
